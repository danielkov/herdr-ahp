[package]
name = "herdr-ahp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agent Hooks Protocol hook that reports agent state to HerdR"
license = "Apache-2.0"
repository = "https://github.com/danielkov/herdr-ahp"
readme = "README.md"
keywords = ["herdr", "ahp", "agent-hooks", "agents", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["scripts/", ".github/"]

[dependencies]
agenthooksprotocol = { version = "=0.6.0", default-features = false }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[profile.dev]
debug = 0
incremental = false

[dev-dependencies]
agenthooksprotocol = { version = "=0.6.0", default-features = false, features = ["tokio-process"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }
