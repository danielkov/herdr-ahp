[package]
name = "herdr-ahp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Generic Agent Hooks Protocol observation bridge for HerdR"

[dependencies]
agenthooksprotocol = { version = "=0.1.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[profile.dev]
debug = 0
incremental = false

[dev-dependencies]
agenthooksprotocol = { version = "=0.1.0", default-features = false, features = ["tokio-process"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "time"] }
